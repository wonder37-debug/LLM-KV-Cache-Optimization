name: AsymAPC experimental CPU smoke
on:
  pull_request:
    branches: [main, experiment/asymcache-inspired-contiguous-apc]
    paths:
      - 'src/kvopt/costaware/asym_apc_native.py'
      - 'src/kvopt/costaware/a2_native.py'
      - 'scripts/spikes/phase2_minimal_observability_metal.py'
      - 'tests/test_asym_apc_native.py'
      - 'tests/test_asym_apc_repo_integration.py'
      - 'scripts/probes/asym_apc_native/**'
      - 'docs/experiments/asym-apc-trusted-evidence.md'
      - '.github/workflows/asym-apc-cpu.yml'
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: New Native arm, campaign, request-time accounting and probe fairness tests
        run: |
          python -m pytest -q \
            tests/test_asym_apc_native_arm.py \
            tests/test_asym_apc_campaign.py \
            tests/test_asym_apc_real_blockpool_probe.py \
            tests/test_asym_apc_native.py \
            tests/test_asym_apc_repo_integration.py
      - run: python -m pytest -q tests/test_costaware_a2_native.py tests/test_costaware_a2_evidence.py tests/test_costaware_a2_contract.py tests/test_continuum_retention_integration.py tests/test_continuum_pressure.py tests/test_continuum_vllm_observation_runner.py
      - name: All self-contained repository CPU tests
        run: |
          python -m pytest -q tests --disable-warnings --tb=line \
            --deselect=tests/test_continuum_bounded_campaign.py::test_materialize_campaign_freezes_54_runs_and_cross_arm_time \
            --deselect=tests/test_continuum_bounded_campaign.py::test_validation_rejects_tampered_logical_sequence
      - name: Compile Native implementation, calibration, probes and analysis
        run: python -m compileall -q src/kvopt scripts/spikes/phase2_minimal_observability_metal.py scripts/probes/asym_apc_native
      - run: python scripts/probes/asym_apc_native/simulate.py --groups 160 --seed 20261115
